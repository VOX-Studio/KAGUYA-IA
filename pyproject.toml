[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaguya_ia"
version = "0.1.0"
description = "IA locale autonome Kaguya"
readme = "README.md"
authors = [
  { name = "VOX", email = "your-email@example.com" }
]
requires-python = ">=3.10"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
